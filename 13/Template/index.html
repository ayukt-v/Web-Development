<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            height: 100vh;
            display: grid;
            grid-template-rows: repeat(30, 1fr);
            grid-template-columns: repeat(25, 1fr);
        }

        .parent_1 {
            border: 2px solid black;
            grid-row: 2/30;
            grid-column: 2/25;
        }


        .child_1 {
            border: 2px solid black;
            grid-row: 7/29;
            grid-column: 3/10;
        }

        .child_2 {
            border: 2px solid black;
            grid-row: 3/6;
            grid-column: 3/24;

        }

        .child_3 {
            border: 2px solid black;
            grid-row: 7/8;
            grid-column: 11/24;

        }

        .child_4 {
            border: 2px solid black;
            grid-row: 9/29;
            grid-column: 13/20;

        }

        .child_5 {
            border: 2px solid black;
            grid-row: 10/17;
            grid-column: 21/24;

        }

        .child_6 {
            border: 2px solid black;
            grid-row: 10/14;
            grid-column: 14/19;

        }

        .child_7 {
            border: 2px solid black;
            grid-row: 15/19;
            grid-column: 14/19;

        }

        .child_8 {
            border: 2px solid black;
            grid-row: 20/24;
            grid-column: 14/19;

        }
         .child_9{
            border: 2px solid black;
            grid-row: 25/28;
            grid-column: 14/19;

        }
    </style>

</head>

<body>


    <div class="parent_1"></div>
    <div class="child_1"></div>
    <div class="child_2"></div>
    <div class="child_3"></div>
    <div class="child_4"></div>
    <div class="child_5"></div>
    <div class="child_6"></div>
    <div class="child_7"></div>
    <div class="child_8"></div>
    <div class="child_9"></div>
    



</body>

</html>
