<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wikipedia Style Menu</title>
    <style>
        /* Base Reset */
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
        }

        Hide the checkbox completely
        #menu-toggle {
            display: none;
        }

        /* Hamburger Icon Button Styling */
        .hamburger-button {
            display: inline-block;
            cursor: pointer;
            padding: 10px;
            border: 1px solid #a2a9b1;
            border-radius: 2px;
            background-color: #fff;
        }

        .hamburger-button:hover {
            background-color: #f8f9fa;
        }

        /* Drawing the 3 bars inside the hamburger icon */
        .bar {
            width: 22px;
            height: 2px;
            background-color: #202122;
            margin: 4px 0;
            display: block;
        }

        /* Dropdown Container */
        .menu-container {
            position: relative;
            display: inline-block;
        }

        /* Sidebar Menu Layout (Hidden by Default) */
        .sidebar-menu {
            display: none;
            position: absolute;
            top: 45px;
            left: 0;
            width: 240px;
            background: #ffffff;
            border: 1px solid #a2a9b1;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 15px 0;
            z-index: 1000;
        }

        /* Header Layout inside Menu */
        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px 10px 15px;
            border-bottom: 1px solid #eaecf0;
        }

        .menu-header h3 {
            margin: 0;
            font-size: 16px;
            color: #202122;
        }

        .sidebar-btn {
            font-size: 12px;
            color: #202122;
            background: #f8f9fa;
            border: 1px solid #a2a9b1;
            padding: 4px 8px;
            cursor: pointer;
            border-radius: 2px;
        }

        /* Navigation List Styling */
        .menu-list {
            list-style: none;
            padding: 0;
            margin: 10px 0 0 0;
        }

        .menu-list li a {
            display: block;
            padding: 8px 15px;
            color: #36c;
            text-decoration: none;
            font-size: 14px;
        }

        .menu-list li a:hover {
            background-color: #eaecf0;
            text-decoration: underline;
        }

        /* Separator lines for sectioning links */
        .menu-list .separator {
            height: 1px;
            background-color: #eaecf0;
            margin: 8px 0;
        }

        .menu-list .grey-text {
            color: #202122;
        }

        /* 🔑 THE CORE LOGIC: Show the sidebar when the hidden checkbox is checked */
        #menu-toggle:checked ~ .sidebar-menu {
            display: block;
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <!-- Hidden checkbox toggled by the label -->
        <input type="checkbox" id="menu-toggle">
        
        <!-- The Hamburger Icon button -->
        <label for="menu-toggle" class="hamburger-button">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </label>

        <!-- Dropdown Sidebar Structure -->
        <div class="sidebar-menu">
            <div class="menu-header">
                <h3>Main menu</h3>
                <button class="sidebar-btn">move to sidebar</button>
            </div>
            
            <ul class="menu-list">
                <li><a href="#">Main page</a></li>
                <li><a href="#">Contents</a></li>
                <li><a href="#">Current events</a></li>
                <li><a href="#">Random article</a></li>
                <li><a href="#">About Wikipedia</a></li>
                <li><a href="#">Contact us</a></li>
                
                <div class="separator"></div>
                
                <li><a href="#" class="grey-text">Contribute</a></li>
                
                <div class="separator"></div>
                
                <li><a href="#">Help</a></li>
                <li><a href="#">Learn to edit</a></li>
                <li><a href="#">Community portal</a></li>
                <li><a href="#">Recent changes</a></li>
                <li><a href="#">Upload file</a></li>
                <li><a href="#">Special pages</a></li>
            </ul>
        </div>
    </div>

</body>
</html>
